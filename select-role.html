<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Role - LegacyHold Escrow</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e1a 0%, #111827 100%);
      padding: 2rem;
      font-family: 'DM Sans', sans-serif;
    }

    .role-container {
      background: #1e2a3a;
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 8px;
      padding: 3rem 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .role-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .role-header h1 {
      color: #c9a84c;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
    }

    .role-header p {
      color: #b0b0b0;
      font-size: 0.95rem;
    }

    .role-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .role-card {
      background: #111827;
      border: 2px solid rgba(201, 168, 76, 0.2);
      border-radius: 8px;
      padding: 2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .role-card:hover {
      border-color: #c9a84c;
      background: rgba(201, 168, 76, 0.05);
      transform: translateY(-4px);
    }

    .role-card.selected {
      border-color: #c9a84c;
      background: rgba(201, 168, 76, 0.1);
    }

    .role-card h3 {
      color: #e4c97a;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
    }

    .role-card p {
      color: #707070;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .role-button {
      width: 100%;
      background-color: #c9a84c;
      color: #0a0e1a;
      padding: 0.75rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid #c9a84c;
      margin-top: 2rem;
    }

    .role-button:hover:not(:disabled) {
      background-color: #e4c97a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201, 168, 76, 0.35);
    }

    .role-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-message {
      background-color: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #e74c3c;
      padding: 0.75rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .loading {
      display: none;
      color: #c9a84c;
      text-align: center;
    }

    @media (max-width: 480px) {
      .role-container {
        padding: 2rem 1.5rem;
      }
      .role-header h1 {
        font-size: 1.5rem;
      }
      .role-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="role-container">
    <div class="role-header">
      <h1>LegacyHold</h1>
      <p>Choose your account type</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div class="role-options">
      <div class="role-card" onclick="selectRole(event, 'buyer')">
        <h3>Buyer</h3>
        <p>Purchase items with full escrow protection and secure payment</p>
      </div>
      <div class="role-card" onclick="selectRole(event, 'seller')">
        <h3>Seller</h3>
        <p>Sell items safely and get paid instantly after delivery</p>
      </div>
    </div>

    <button class="role-button" id="continueBtn" onclick="continueWithRole()" disabled>
      Continue
    </button>

    <div class="loading" id="loading">
      Setting up your account...
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wdhvrghpmypjthpkfffb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkaHZyZ2hwbXlwanRocGtmZmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDUzNzksImV4cCI6MjA5MzYyMTM3OX0.dXNJyQZNOfvqLwYl10gtZv5sCHP9XLlxYdRnHzp5p3g';

    let sbClient = null;
    let selectedRole = null;

    try {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('Supabase initialized');
    } catch (error) {
      console.error('Supabase init error:', error);
    }

    function selectRole(event, role) {
      selectedRole = role;
      document.querySelectorAll('.role-card').forEach(card => {
        card.classList.remove('selected');
      });
      event.target.closest('.role-card').classList.add('selected');
      document.getElementById('continueBtn').disabled = false;
    }

    async function continueWithRole() {
      if (!selectedRole) {
        document.getElementById('errorMessage').textContent = 'Please select a role';
        document.getElementById('errorMessage').style.display = 'block';
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('continueBtn').disabled = true;

      try {
        const userId = localStorage.getItem('userId');
        const userEmail = localStorage.getItem('userEmail');

        if (!userId || !userEmail) {
          throw new Error('User session not found. Please sign up again.');
        }

        if (!sbClient) {
          throw new Error('Database connection failed');
        }

        const { data, error: updateError } = await sbClient
          .from('users')
          .update({ role: selectedRole })
          .eq('id', userId)
          .select();

        if (updateError) {
          throw new Error('Failed to save role: ' + updateError.message);
        }

        localStorage.setItem('userRole', selectedRole);

        const dashboardUrl = selectedRole === 'buyer'
          ? './buyer-dashboard.html'
          : './seller-dashboard.html';

        window.location.href = dashboardUrl;

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('errorMessage').textContent = error.message || 'An error occurred';
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('continueBtn').disabled = false;
      }
    }
  </script>
</body>
</html>
