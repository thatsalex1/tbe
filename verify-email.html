<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - LegacyHoldEscrow</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .verify-container {
      background: linear-gradient(135deg, #1e2a3a 0%, #111827 100%);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 12px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .verify-header {
      margin-bottom: 2rem;
    }

    .verify-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 300;
      color: #c9a84c;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
    }

    .verify-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .verify-header p {
      color: #b0b0b0;
      font-size: 0.95rem;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }

    .email-display {
      background: rgba(201, 168, 76, 0.1);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 6px;
      padding: 1rem;
      margin: 1.5rem 0;
      color: #e4c97a;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: #e4c97a;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      letter-spacing: 0.5px;
    }

    .code-inputs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .code-input {
      width: 100%;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 6px;
      color: #ffffff;
      font-size: 1.2rem;
      text-align: center;
      font-weight: 700;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .code-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: #c9a84c;
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
    }

    .code-input::placeholder {
      color: rgba(255, 255, 255, 0.2);
      font-size: 1rem;
    }

    .error-message {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #ff6b5b;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .success-message {
      background: rgba(46, 204, 113, 0.1);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #c9a84c 0%, #e4c97a 100%);
      border: none;
      border-radius: 6px;
      color: #0a0e1a;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(201, 168, 76, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .resend-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(201, 168, 76, 0.1);
    }

    .resend-section p {
      color: #b0b0b0;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .resend-btn {
      color: #c9a84c;
      background: none;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.3s ease;
    }

    .resend-btn:hover {
      color: #e4c97a;
    }

    .resend-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      text-decoration: none;
    }

    .loading {
      display: none;
      text-align: center;
      color: #c9a84c;
      margin-top: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(201, 168, 76, 0.2);
      border-top: 2px solid #c9a84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .verify-container {
        padding: 2rem 1.5rem;
      }

      .logo {
        font-size: 1.8rem;
      }

      .verify-header h2 {
        font-size: 1.5rem;
      }

      .code-inputs {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="verify-container">
    <div class="verify-header">
      <div class="verify-icon">📧</div>
      <div class="logo">LegacyHold</div>
      <h2>Verify Your Email</h2>
      <p>We've sent a verification code to:</p>
      <div class="email-display" id="emailDisplay">
        you@example.com
      </div>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="verifyForm" onsubmit="handleVerify(event)">
      <div class="form-group">
        <label>Enter 6-digit verification code:</label>
        <div class="code-inputs">
          <input class="code-input" maxlength="1" placeholder="0" type="text" id="code1">
          <input class="code-input" maxlength="1" placeholder="0" type="text" id="code2">
          <input class="code-input" maxlength="1" placeholder="0" type="text" id="code3">
          <input class="code-input" maxlength="1" placeholder="0" type="text" id="code4">
          <input class="code-input" maxlength="1" placeholder="0" type="text" id="code5">
          <input class="code-input" maxlength="1" placeholder="0" type="text" id="code6">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Verify & Continue
      </button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Verifying code...</p>
      </div>
    </form>

    <div class="resend-section">
      <p>Didn't receive a code?</p>
      <button class="resend-btn" onclick="handleResend()">Resend verification code</button>
    </div>
  </div>

  <script async crossorigin="anonymous" src="https://cdn.clerk.com/clerk.js" data-clerk-publishable-key="pk_test_ZW5hYmxpbmctcHVnLTcxLmNsZXJrLmFjY291bnRzLmRldiQ"></script>

  <script>
    // Display email on page load
    window.addEventListener('load', () => {
      const email = localStorage.getItem('signupEmail');
      if (email) {
        document.getElementById('emailDisplay').textContent = email;
      }
    });

    // Auto-move focus between code inputs
    document.querySelectorAll('.code-input').forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value) {
          if (index < 5) {
            document.querySelectorAll('.code-input')[index + 1].focus();
          }
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          document.querySelectorAll('.code-input')[index - 1].focus();
        }
      });
    });

    async function handleVerify(event) {
      event.preventDefault();

      const codes = Array.from(document.querySelectorAll('.code-input')).map(el => el.value);
      const code = codes.join('');

      if (code.length !== 6) {
        showError('Please enter all 6 digits');
        return;
      }

      hideError();
      showLoading(true);
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      try {
        console.log('🔐 Starting email verification...');

        await Clerk.load();
        console.log('✓ Clerk loaded');

        const email = localStorage.getItem('signupEmail');
        const firstName = localStorage.getItem('firstName');
        const lastName = localStorage.getItem('lastName');

        // Attempt to verify email
        console.log('📧 Verifying email code...');
        const signUpAttempt = await Clerk.client.signUp.attemptEmailAddressVerification({
          code: code
        });

        console.log('✓ Email verified:', signUpAttempt);

        if (signUpAttempt.status === 'complete') {
          console.log('✓ Signup complete');

          // Create session
          const createdSessionId = signUpAttempt.createdSessionId;
          await Clerk.setActive({ session: createdSessionId });
          console.log('✓ Session created');

          // Get user
          const user = await Clerk.user;
          console.log('✓ User loaded:', user);

          // Store user data
          localStorage.setItem('userId', user.id);
          localStorage.setItem('userEmail', email);
          localStorage.setItem('userName', `${firstName} ${lastName}`);

          // Clear signup data
          localStorage.removeItem('signupEmail');
          localStorage.removeItem('firstName');
          localStorage.removeItem('lastName');

          showSuccess('Email verified! Redirecting...');

          setTimeout(() => {
            window.location.href = './select-role.html';
          }, 1500);
        } else {
          showError('Email verification incomplete');
        }

      } catch (error) {
        console.error('✗ Verification error:', error);

        if (error.errors && error.errors.length > 0) {
          const err = error.errors[0];
          if (err.code === 'form_code_invalid') {
            showError('Invalid verification code. Please try again.');
          } else {
            showError(err.message || 'Verification failed');
          }
        } else {
          showError(error.message || 'An error occurred');
        }
      } finally {
        showLoading(false);
        submitBtn.disabled = false;
      }
    }

    async function handleResend() {
      const btn = event.target;
      btn.disabled = true;

      try {
        console.log('📧 Resending verification code...');

        await Clerk.load();

        // Get the existing signup attempt
        const email = localStorage.getItem('signupEmail');
        const password = localStorage.getItem('password') || '';

        // Create a new signup attempt
        const signUpAttempt = await Clerk.client.signUp.create({
          emailAddress: email
        });

        // Request email verification again
        await signUpAttempt.prepareEmailAddressVerification({ strategy: 'email_code' });

        console.log('✓ Verification code resent');
        alert('Verification code sent to your email!');

      } catch (error) {
        console.error('✗ Resend error:', error);
        alert('Failed to resend code. Please try again.');
      } finally {
        btn.disabled = false;
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function hideError() {
      const errorEl = document.getElementById('errorMessage');
      errorEl.style.display = 'none';
    }

    function showSuccess(message) {
      const successEl = document.getElementById('successMessage');
      successEl.textContent = message;
      successEl.style.display = 'block';
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }
  </script>
</body>
</html>
