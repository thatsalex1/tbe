<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - LegacyHoldEscrow</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-container {
      background: linear-gradient(135deg, #1e2a3a 0%, #111827 100%);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 12px;
      padding: 3rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-section {
      margin-bottom: 1.5rem;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 300;
      color: #c9a84c;
      letter-spacing: 2px;
    }

    .auth-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .auth-header p {
      color: #b0b0b0;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: #e4c97a;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: #c9a84c;
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .remember-forgot label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #b0b0b0;
      cursor: pointer;
      margin: 0;
    }

    .remember-forgot input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .remember-forgot a {
      color: #c9a84c;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .remember-forgot a:hover {
      color: #e4c97a;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #c9a84c 0%, #e4c97a 100%);
      border: none;
      border-radius: 6px;
      color: #0a0e1a;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(201, 168, 76, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #ff6b5b;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(201, 168, 76, 0.1);
    }

    .auth-footer p {
      color: #b0b0b0;
      font-size: 0.9rem;
    }

    .auth-footer a {
      color: #c9a84c;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .auth-footer a:hover {
      color: #e4c97a;
    }

    .loading {
      display: none;
      text-align: center;
      color: #c9a84c;
      margin-top: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(201, 168, 76, 0.2);
      border-top: 2px solid #c9a84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 2rem 1.5rem;
      }

      .logo {
        font-size: 1.8rem;
      }

      .auth-header h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo-section">
        <div class="logo">LegacyHold</div>
      </div>
      <h2>Sign In</h2>
      <p>Welcome back to your account</p>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="signinForm" onsubmit="handleSignin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
        >
      </div>

      <div class="remember-forgot">
        <label>
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled title="Loading authentication system...">
        Sign In
      </button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Signing in...</p>
      </div>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="signup-custom.html">Create one</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script async crossorigin="anonymous" src="https://cdn.clerk.com/clerk.js" data-clerk-publishable-key="pk_test_ZW5hYmxpbmctcHVnLTcxLmNsZXJrLmFjY291bnRzLmRldiQ"></script>

  <script>
    // Supabase configuration
    const SUPABASE_URL = 'https://wdhvrghpmypjthpkfffb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkaHZyZ2hwbXlwanRocGtmZmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDUzNzksImV4cCI6MjA5MzYyMTM3OX0.dXNJyQZNOfvqLwYl10gtZv5sCHP9XLlxYdRnHzp5p3g';

    // Initialize Supabase
    let supabase = null;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('✓ Supabase initialized');
    } catch (error) {

  <script>
    // Wait for Clerk to load
    let clerkReady = false;

    window.addEventListener('load', async () => {
      console.log('⏳ Waiting for Clerk to load...');
      try {
        await Clerk.load();
        clerkReady = true;
        console.log('✓ Clerk loaded and ready');
        document.getElementById('submitBtn').disabled = false;
      } catch (error) {
        console.error('✗ Failed to load Clerk:', error);
      }
    });

    async function handleSignin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Clear messages
      hideError();

      if (!email || !password) {
        showError('Please enter email and password');
        return;
      }

      // Check if Clerk is ready
      if (!clerkReady) {
        showError('System is loading, please wait...');
        return;
      }

      if (typeof Clerk === 'undefined') {
        showError('Authentication service failed to load. Please refresh the page.');
        return;
      }

      // Show loading
      showLoading(true);
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      try {
        console.log('🚀 Starting signin...');

        // Check Supabase
        if (!supabase) {
          throw new Error('Database connection failed. Please refresh the page.');
        }

        console.log('🔑 Looking up user...');

        // Find user by email in Supabase
        const { data: users, error: queryError } = await supabase
          .from('users')
          .select('*')
          .eq('email', email)
          .single();

        if (queryError || !users) {
          console.error('User not found:', queryError);
          throw new Error('Email not found. Please create an account first.');
        }

        console.log('✓ User found:', users);
        console.log('✓ Signin successful');

        // Store user data in localStorage
        localStorage.setItem('userId', users.id);
        localStorage.setItem('userEmail', users.email);
        localStorage.setItem('userName', users.full_name);
        localStorage.setItem('userRole', users.role);

        console.log('✓ User data stored, redirecting to role selection...');

        // Redirect to role selection or dashboard
        setTimeout(() => {
          if (users.role) {
            // If they already have a role, go to dashboard
            window.location.href = users.role === 'buyer' ? './buyer-dashboard.html' : './seller-dashboard.html';
          } else {
            // If no role yet, go to role selection
            window.location.href = './select-role.html';
          }
        }, 500);

      } catch (error) {
        console.error('✗ Signin error:', error);

        // Handle specific Clerk errors
        if (error.errors && error.errors.length > 0) {
          const clerkError = error.errors[0];
          if (clerkError.code === 'form_identifier_not_found') {
            showError('Email not found. Please create an account first.');
          } else if (clerkError.code === 'form_password_incorrect') {
            showError('Incorrect password. Please try again.');
          } else {
            showError(clerkError.message || 'Sign in failed. Please try again.');
          }
        } else {
          showError(error.message || 'An error occurred during signin');
        }
      } finally {
        showLoading(false);
        submitBtn.disabled = false;
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function hideError() {
      const errorEl = document.getElementById('errorMessage');
      errorEl.style.display = 'none';
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }
  </script>
</body>
</html>
