<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[UPDATED May 16 v3.0] Sign In - TrustBridge Escrow</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #f1f5f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #16202e;
    }
    .signin-container {
      width: 100%;
      max-width: 460px;
      padding: 40px;
      background: #ffffff;
      border: 1px solid #e7ece9;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(15, 30, 25, 0.1);
    }
    h1 {
      color: #16202e;
      margin-bottom: 30px;
      text-align: center;
      font-size: 1.7rem;
      font-family: 'Sora', sans-serif;
      font-weight: 800;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #5b6b7b;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px;
      background: #f7f9f8;
      border: 1px solid #e7ece9;
      border-radius: 10px;
      color: #16202e;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #16a34a;
      background: #ffffff;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .btn:hover:not(:disabled) {
      background: #0f7a37;
      transform: translateY(-2px);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      display: block;
      background: #e9f8ef;
      border: 1px solid #16a34a;
      color: #0f7a37;
    }
    .message.error {
      display: block;
      background: rgba(244, 67, 54, 0.08);
      border: 1px solid #f44336;
      color: #c0392b;
    }
    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #5b6b7b;
    }
    .signup-link a {
      color: #16a34a;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="signin-container">
    <h1>Sign In</h1>
    <div id="message" class="message"></div>

    <form id="signinForm" onsubmit="handleSignin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="signup-link">
      Don't have an account? <a href="/signup-simple">Create one</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wdhvrghpmypjthpkfffb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkaHZyZ2hwbXlwanRocGtmZmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDUzNzksImV4cCI6MjA5MzYyMTM3OX0.dXNJyQZNOfvqLwYl10gtZv5sCHP9XLlxYdRnHzp5p3g';

    let sbClient = null;

    function initSupabase() {
      if (!window.supabase) {
        console.error('Supabase library not loaded');
        return;
      }
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('✅ Supabase initialized');
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }

    async function handleSignin(event) {
      event.preventDefault();
      console.log('Sign in form submitted');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        if (!sbClient) {
          initSupabase();
        }

        if (!sbClient) {
          throw new Error('Database not connected');
        }

        const { data: authData, error: authError } = await sbClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (authError || !authData.user) {
          throw new Error('Email or password is incorrect');
        }

        const { data: users, error } = await sbClient
          .from('users')
          .select('*')
          .eq('id', authData.user.id)
          .single();

        if (error || !users) {
          throw new Error('Signed in, but could not load your profile');
        }

        localStorage.setItem('userId', users.id);
        localStorage.setItem('userEmail', users.email);
        localStorage.setItem('userName', users.full_name || users.email);
        localStorage.setItem('userRole', users.role || '');

        showMessage('Signed in! Redirecting...', 'success');

        setTimeout(() => {
          if (users.is_admin) {
            window.location.href = '/admin-dashboard';
          } else if (users.role) {
            window.location.href = users.role === 'buyer' ? '/buyer-dashboard' : '/seller-dashboard';
          } else {
            window.location.href = '/select-role';
          }
        }, 1500);

      } catch (error) {
        console.error('Error:', error);
        showMessage('Error: ' + error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSupabase);
    } else {
      initSupabase();
    }
  </script>
</body>
</html>
