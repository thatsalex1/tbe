<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - TrustBridge Escrow</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
    }

    .signin-container {
      width: 100%;
      max-width: 500px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    h1 {
      color: #c9a84c;
      margin-bottom: 30px;
      text-align: center;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #c9a84c;
      background: rgba(255, 255, 255, 0.15);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #c9a84c;
      color: #0a0e1a;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
    }

    .btn:hover:not(:disabled) {
      background: #e0bc5f;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      display: block;
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid #4caf50;
      color: #90ee90;
    }

    .message.error {
      display: block;
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid #f44336;
      color: #ff9999;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .signup-link a {
      color: #c9a84c;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="signin-container">
    <h1>Sign In</h1>
    <div id="message" class="message"></div>

    <form id="signinForm" onsubmit="handleSignin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="signup-link">
      Don't have an account? <a href="signup-simple.html">Create one</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ============================================
    // SUPABASE CONFIGURATION
    // ============================================
    const SUPABASE_URL = 'https://wdhvrghpmypjthpkfffb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkaHZyZ2hwbXlwanRocGtmZmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDUzNzksImV4cCI6MjA5MzYyMTM3OX0.dXNJyQZNOfvqLwYl10gtZv5sCHP9XLlxYdRnHzp5p3g';

    let supabase = null;

    // ============================================
    // INITIALIZE SUPABASE
    // ============================================
    function initSupabase() {
      try {
        if (!window.supabase) {
          console.error('❌ Supabase JS library not loaded');
          return false;
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase initialized successfully');
        return true;
      } catch (error) {
        console.error('❌ Failed to initialize Supabase:', error);
        return false;
      }
    }

    // ============================================
    // SHOW MESSAGE TO USER
    // ============================================
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      console.log(`📢 Message [${type}]: ${text}`);
    }

    // ============================================
    // HANDLE SIGNIN FORM SUBMISSION
    // ============================================
    async function handleSignin(event) {
      event.preventDefault();
      console.log('🚀 Sign in attempt started');

      // Get form values
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      console.log('📝 Form values:', { email });

      // ===== VALIDATION =====
      if (!email || !password) {
        showMessage('❌ Please fill in all fields', 'error');
        return;
      }

      // ===== DISABLE BUTTON DURING SUBMISSION =====
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        // ===== ENSURE SUPABASE IS INITIALIZED =====
        if (!supabase) {
          console.log('⏳ Supabase not initialized, initializing now...');
          const initialized = initSupabase();
          if (!initialized) {
            throw new Error('Failed to initialize database connection');
          }
        }

        console.log('🔍 Looking up user:', email);

        // ===== QUERY USER FROM DATABASE =====
        const { data: users, error: queryError } = await supabase
          .from('users')
          .select('*')
          .eq('email', email)
          .single();

        if (queryError || !users) {
          console.error('❌ User not found or query error:', queryError);
          throw new Error('Email or password is incorrect');
        }

        console.log('✅ User found in database');

        // ===== VERIFY PASSWORD =====
        if (users.password !== password) {
          console.error('❌ Password does not match');
          throw new Error('Email or password is incorrect');
        }

        console.log('✅ Password verified successfully');

        // ===== STORE IN LOCAL STORAGE =====
        localStorage.setItem('userId', users.id);
        localStorage.setItem('userEmail', users.email);
        localStorage.setItem('userName', users.full_name || users.email);
        localStorage.setItem('userRole', users.role || '');

        console.log('✅ User data stored in localStorage');

        // ===== SHOW SUCCESS MESSAGE =====
        showMessage('✅ Signed in successfully! Redirecting...', 'success');

        // ===== REDIRECT TO APPROPRIATE DASHBOARD =====
        setTimeout(() => {
          if (users.role) {
            const redirectUrl = users.role === 'buyer' ? './buyer-dashboard.html' : './seller-dashboard.html';
            console.log('🔄 Redirecting to dashboard:', redirectUrl);
            window.location.href = redirectUrl;
          } else {
            console.log('🔄 Redirecting to role selection...');
            window.location.href = './select-role.html';
          }
        }, 1500);

      } catch (error) {
        console.error('❌ Sign in error:', error);
        showMessage(`❌ Error: ${error.message || 'Sign in failed. Please try again.'}`, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }

    // ============================================
    // INITIALIZE ON PAGE LOAD
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      console.log('📄 Page loaded, initializing Supabase...');
      initSupabase();
    });

    // Also try immediate initialization in case DOM is already ready
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      console.log('📄 DOM already ready, initializing Supabase...');
      initSupabase();
    }
  </script>
</body>
</html>
