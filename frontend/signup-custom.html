<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - LegacyHoldEscrow</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-container {
      background: linear-gradient(135deg, #1e2a3a 0%, #111827 100%);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 12px;
      padding: 3rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-section {
      margin-bottom: 1.5rem;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 300;
      color: #c9a84c;
      letter-spacing: 2px;
    }

    .auth-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .auth-header p {
      color: #b0b0b0;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: #e4c97a;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: #c9a84c;
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #c9a84c 0%, #e4c97a 100%);
      border: none;
      border-radius: 6px;
      color: #0a0e1a;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(201, 168, 76, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #ff6b5b;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .success-message {
      background: rgba(46, 204, 113, 0.1);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(201, 168, 76, 0.1);
    }

    .auth-footer p {
      color: #b0b0b0;
      font-size: 0.9rem;
    }

    .auth-footer a {
      color: #c9a84c;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .auth-footer a:hover {
      color: #e4c97a;
    }

    .loading {
      display: none;
      text-align: center;
      color: #c9a84c;
      margin-top: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(201, 168, 76, 0.2);
      border-top: 2px solid #c9a84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 2rem 1.5rem;
      }

      .logo {
        font-size: 1.8rem;
      }

      .auth-header h2 {
        font-size: 1.5rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo-section">
        <div class="logo">LegacyHold</div>
      </div>
      <h2>Create Account</h2>
      <p>Join our secure escrow platform</p>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="signupForm" onsubmit="handleSignup(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            placeholder="John"
            required
          >
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            placeholder="Doe"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled title="Loading authentication system...">
        Create Account
      </button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Creating your account...</p>
      </div>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="signin-custom.html">Sign In</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script async crossorigin="anonymous" src="https://cdn.clerk.com/clerk.js" data-clerk-publishable-key="pk_test_ZW5hYmxpbmctcHVnLTcxLmNsZXJrLmFjY291bnRzLmRldiQ"></script>

  <script>
    // Supabase configuration
    const SUPABASE_URL = 'https://wdhvrghpmypjthpkfffb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkaHZyZ2hwbXlwanRocGtmZmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDUzNzksImV4cCI6MjA5MzYyMTM3OX0.dXNJyQZNOfvqLwYl10gtZv5sCHP9XLlxYdRnHzp5p3g';

    // Initialize Supabase
    let supabase = null;
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('✓ Supabase initialized');
    } catch (error) {
      console.error('✗ Supabase error:', error);
    }
  </script>

  <script>
    // Wait for Clerk to load
    let clerkReady = false;

    window.addEventListener('load', async () => {
      console.log('⏳ Waiting for Clerk to load...');
      try {
        await Clerk.load();
        clerkReady = true;
        console.log('✓ Clerk loaded and ready');
        document.getElementById('submitBtn').disabled = false;
      } catch (error) {
        console.error('✗ Failed to load Clerk:', error);
      }
    });

    async function handleSignup(event) {
      event.preventDefault();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Clear messages
      hideError();
      hideSuccess();

      // Validation
      if (!firstName || !lastName || !email || !password) {
        showError('Please fill in all fields');
        return;
      }

      if (password.length < 8) {
        showError('Password must be at least 8 characters');
        return;
      }

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      // Check if Clerk is ready
      if (!clerkReady) {
        showError('System is loading, please wait...');
        return;
      }

      if (typeof Clerk === 'undefined') {
        showError('Authentication service failed to load. Please refresh the page.');
        return;
      }

      // Show loading
      showLoading(true);
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      try {
        console.log('🚀 Starting signup...');

        // Check Supabase
        if (!supabase) {
          throw new Error('Database connection failed. Please refresh the page.');
        }

        console.log('📝 Creating user in database...');

        // Create user in Supabase
        const { data, error } = await supabase
          .from('users')
          .insert([
            {
              id: `user_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
              email: email,
              full_name: `${firstName} ${lastName}`,
              role: null,
              available_balance: 0,
              pending_balance: 0
            }
          ])
          .select();

        if (error) {
          console.error('✗ Database error:', error);
          if (error.code === '23505') {
            throw new Error('This email is already registered. Please sign in instead.');
          }
          throw new Error(error.message || 'Failed to create account');
        }

        console.log('✓ User created:', data);

        const user = data[0];

        // Store user data in localStorage
        localStorage.setItem('userId', user.id);
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userName', `${firstName} ${lastName}`);
        localStorage.setItem('userRole', null);

        console.log('✓ User data stored in localStorage');

        // Show success message
        showSuccess('Account created! Redirecting...');

        // Redirect to role selection
        setTimeout(() => {
          window.location.href = './select-role.html';
        }, 1500);

      } catch (error) {
        console.error('✗ Signup error:', error);

        // Handle specific Clerk errors
        if (error.errors && error.errors.length > 0) {
          const clerkError = error.errors[0];
          if (clerkError.code === 'form_identifier_exists') {
            showError('This email is already registered. Please sign in instead.');
          } else if (clerkError.code === 'form_password_pwned') {
            showError('This password is too common. Please choose a stronger password.');
          } else {
            showError(clerkError.message || 'Signup failed. Please try again.');
          }
        } else {
          showError(error.message || 'An error occurred during signup');
        }
      } finally {
        showLoading(false);
        submitBtn.disabled = false;
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function hideError() {
      const errorEl = document.getElementById('errorMessage');
      errorEl.style.display = 'none';
    }

    function showSuccess(message) {
      const successEl = document.getElementById('successMessage');
      successEl.textContent = message;
      successEl.style.display = 'block';
    }

    function hideSuccess() {
      const successEl = document.getElementById('successMessage');
      successEl.style.display = 'none';
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }
  </script>
</body>
</html>
