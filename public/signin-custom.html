<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - TrustBridge Escrow</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
    }
    .signin-container {
      width: 100%;
      max-width: 500px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    h1 {
      color: #c9a84c;
      margin-bottom: 30px;
      text-align: center;
      font-size: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ccc;
    }
    input {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #c9a84c;
      background: rgba(255, 255, 255, 0.15);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #c9a84c;
      color: #0a0e1a;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .btn:hover:not(:disabled) {
      background: #e0bc5f;
      transform: translateY(-2px);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      display: block;
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid #4caf50;
      color: #90ee90;
    }
    .message.error {
      display: block;
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid #f44336;
      color: #ff9999;
    }
    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    .signup-link a {
      color: #c9a84c;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="signin-container">
    <h1>Sign In</h1>
    <div id="message" class="message"></div>

    <form id="signinForm" onsubmit="handleSignin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="signup-link">
      Don't have an account? <a href="signup-simple.html">Create one</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wdhvrghpmypjthpkfffb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkaHZyZ2hwbXlwanRocGtmZmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNDUzNzksImV4cCI6MjA5MzYyMTM3OX0.dXNJyQZNOfvqLwYl10gtZv5sCHP9XLlxYdRnHzp5p3g';

    let sbClient = null;

    function initSupabase() {
      if (!window.supabase) {
        console.error('Supabase library not loaded');
        return;
      }
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('✅ Supabase initialized');
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }

    async function handleSignin(event) {
      event.preventDefault();
      console.log('Sign in form submitted');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        if (!sbClient) {
          initSupabase();
        }

        if (!sbClient) {
          throw new Error('Database not connected');
        }

        const { data: users, error } = await sbClient
          .from('users')
          .select('*')
          .eq('email', email)
          .single();

        if (error || !users) {
          throw new Error('Email or password is incorrect');
        }

        if (users.password !== password) {
          throw new Error('Email or password is incorrect');
        }

        localStorage.setItem('userId', users.id);
        localStorage.setItem('userEmail', users.email);
        localStorage.setItem('userName', users.full_name || users.email);
        localStorage.setItem('userRole', users.role || '');

        showMessage('Signed in! Redirecting...', 'success');

        setTimeout(() => {
          if (users.role) {
            window.location.href = users.role === 'buyer' ? './buyer-dashboard.html' : './seller-dashboard.html';
          } else {
            window.location.href = './select-role.html';
          }
        }, 1500);

      } catch (error) {
        console.error('Error:', error);
        showMessage('Error: ' + error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSupabase);
    } else {
      initSupabase();
    }
  </script>
</body>
</html>
